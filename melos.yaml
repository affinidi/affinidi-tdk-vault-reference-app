name: tdk-vault-reference-app
packages:
  - .
scripts:
  analyze:
    name: analyze
    description: "analyze source (lib + integration_test)"
    run: flutter analyze lib integration_test
    exec:
      concurrency: 1
  test:
    name: test
    description: "unit test with coverage"
    run: flutter test test/ --coverage
    exec:
      concurrency: 1
  test-integration:
    name: test-integration
    description: "integration tests"
    run: flutter test integration_test/
    exec:
      concurrency: 1
  gen:
    name: generate-code
    description: generate code
    run: sh scripts/codegen.sh
    exec:
      concurrency: 1
  strings:
    name: generate-strings
    description: generate localized strings
    run: sh scripts/generate_localized_files.sh
    exec:
      concurrency: 1
